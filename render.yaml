services:
  - type: web
    name: medinova-backend
    env: node
    rootDir: medinova/medinova/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "false"
      - key: DB_CONNECT_TIMEOUT_MS
        value: "10000"
      - key: DB_CONNECTION_LIMIT
        value: "10"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: VERCEL_FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
