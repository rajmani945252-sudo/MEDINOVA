[build]
buildCommand = "cd medinova/medinova/backend && npm install"
watchPatterns = [
  "/medinova/medinova/backend/**"
]

[deploy]
startCommand = "cd medinova/medinova/backend && npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
